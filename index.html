<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Points">
<title>Points</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#1c1c1e;--mute:#76767b;--line:#e4e4e0;--acc:#2f3a4a;--accink:#fff;--pos:#2e7d4f;--neg:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--ink:#f1f1f2;--mute:#8e8e93;--line:#2c2c30;--acc:#d8dde6;--accink:#16181c;--pos:#5cc08a;--neg:#e5806f}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f2;--mute:#8e8e93;--line:#2c2c30;--acc:#d8dde6;--accink:#16181c;--pos:#5cc08a;--neg:#e5806f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;margin:0;font-weight:650;letter-spacing:-.3px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.add{background:var(--acc);color:var(--accink);padding:9px 16px;border-radius:10px;font-weight:600;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px}
.rank{width:26px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:6px 0}
.tot{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.btns{display:flex;gap:6px}
.btns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);font-size:18px;font-weight:600}
.btns button:active{background:var(--line)}
.hist{border-top:1px solid var(--line);padding:6px 14px 12px}
.mv{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mv:last-of-type{border-bottom:0}
.pts{font-weight:700;min-width:38px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.mvt{flex:1;min-width:0;overflow-wrap:anywhere}
.date{color:var(--mute);font-size:12px}
.x{color:var(--mute);padding:2px 6px;font-size:16px}
.link{color:var(--mute);font-size:13px;padding:10px 0 0;text-decoration:underline}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px;font-size:19px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.act{display:flex;gap:8px;margin-top:18px}
.act button{flex:1;padding:12px;border-radius:10px;font-weight:600;border:1px solid var(--line)}
.act .ok{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<main>
<header><h1>Classement</h1><button class="add" data-act="newp">+ Personne</button></header>
<div id="list"><div class="empty">Chargement…</div></div>
<div class="note" id="note"></div>
<div class="note"><button class="link" data-act="resetcode">Changer de code</button></div>
</main>
<div id="modal"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* COLLEZ ICI la configuration de votre application web Firebase */
window.FIREBASE_CONFIG={
  apiKey:"AIzaSyBH-y2zX7lK_yy1TjXqRYG1oxDMhQsUh6Q",
  authDomain:"le-meilleur-chauffeur.firebaseapp.com",
  projectId:"le-meilleur-chauffeur",
  appId:"1:939404554394:web:1e447a8f65c52b920e2f23"
};
</script>
<script>
(function(){
var people=[],moves=[],open=null,armed=null,db=null,loaded={p:false,m:false};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(t){try{return new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function sign(n){return (n>0?"+":"")+n}

function render(){
  var tot={};people.forEach(function(p){tot[p.id]=0});
  moves.forEach(function(m){if(m.personId in tot)tot[m.personId]+=Number(m.pts)||0});
  var sorted=people.slice().sort(function(a,b){return tot[b.id]-tot[a.id]||String(a.name).localeCompare(String(b.name),"fr")});
  var el=$("#list");
  if(!loaded.p||!loaded.m){return}
  if(!sorted.length){el.innerHTML='<div class="empty">Aucune personne pour l’instant.<br>Ajoutez-en une avec « + Personne ».</div>';return}
  var rank=0,prev=null,html="";
  sorted.forEach(function(p,i){
    if(tot[p.id]!==prev){rank=i+1;prev=tot[p.id]}
    html+='<div class="card"><div class="row"><div class="rank">'+rank+'</div>'+
      '<button class="name" data-act="toggle" data-id="'+p.id+'">'+esc(p.name)+'</button>'+
      '<div class="tot">'+tot[p.id]+'</div>'+
      '<div class="btns"><button data-act="dec" data-id="'+p.id+'" aria-label="Retirer un point">−</button>'+
      '<button data-act="inc" data-id="'+p.id+'" aria-label="Ajouter un point">+</button>'+
      '<button data-act="custom" data-id="'+p.id+'" aria-label="Points personnalisés">±</button></div></div>';
    if(open===p.id){
      var mv=moves.filter(function(m){return m.personId===p.id}).sort(function(a,b){return b.ts-a.ts});
      html+='<div class="hist">';
      if(!mv.length)html+='<div class="date" style="padding:8px 0">Aucun mouvement.</div>';
      mv.forEach(function(m){
        html+='<div class="mv"><div class="pts '+(m.pts>=0?"pos":"neg")+'">'+sign(m.pts)+'</div><div class="mvt">'+
          (m.comment?esc(m.comment):'<span class="date">Sans commentaire</span>')+'<div class="date">'+fmt(m.ts)+'</div></div>'+
          '<button class="x" data-act="delmove" data-id="'+m.id+'" aria-label="Annuler">✕</button></div>';
      });
      html+='<button class="link" data-act="delp" data-id="'+p.id+'">'+(armed==="p"+p.id?"Confirmer la suppression ?":"Supprimer cette personne")+'</button></div>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
}

function addMove(pid,pts,comment){
  if(!db||!pts)return;
  db.collection("moves").add({personId:pid,pts:pts,comment:comment||"",ts:Date.now()}).catch(fail);
}
function fail(){$("#note").textContent="Action refusée : vérifiez que vous avez les droits d’écriture."}

function modal(html){$("#modal").innerHTML='<div class="ov" data-act="close"><div class="sheet">'+html+'</div></div>'}
function close(){$("#modal").innerHTML=""}

function newPerson(){
  modal('<h2>Nouvelle personne</h2><label>Nom</label><input id="f-name" maxlength="40" autocomplete="off">'+
    '<div class="act"><button data-act="close">Annuler</button><button class="ok" data-act="savep">Ajouter</button></div>');
  setTimeout(function(){var i=$("#f-name");if(i)i.focus()},50);
}
var cust={id:null,dir:1};
function customSheet(id){
  cust={id:id,dir:1};
  var p=people.filter(function(x){return x.id===id})[0];
  modal('<h2>'+esc(p?p.name:"")+'</h2><div class="seg"><button class="on" data-act="dir" data-d="1">Ajouter</button><button data-act="dir" data-d="-1">Retirer</button></div>'+
    '<label>Nombre de points</label><input id="f-n" type="number" inputmode="numeric" min="1" step="1" placeholder="ex. 5">'+
    '<label>Commentaire (facultatif)</label><input id="f-c" maxlength="140" autocomplete="off">'+
    '<div class="act"><button data-act="close">Annuler</button><button class="ok" data-act="savec">Valider</button></div>');
  setTimeout(function(){var i=$("#f-n");if(i)i.focus()},50);
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.dataset.act,id=t.dataset.id;
  if(a==="close"){if(e.target===t||t.tagName==="BUTTON")close();return}
  e.stopPropagation();
  if(a==="savecode"){
    var c=$("#f-code").value.trim().toLowerCase().replace(/\s+/g,"-");
    if(c.length<8){$("#f-code").focus();$("#note").textContent="Code trop court (8 caractères minimum).";return}
    try{localStorage.setItem("room",c)}catch(x){}
    close();boot(c);
  }
  else if(a==="resetcode"){try{localStorage.removeItem("room")}catch(x){}location.reload()}
  else if(a==="newp")newPerson();
  else if(a==="toggle"){open=open===id?null:id;render()}
  else if(a==="inc")addMove(id,1,"");
  else if(a==="dec")addMove(id,-1,"");
  else if(a==="custom")customSheet(id);
  else if(a==="dir"){cust.dir=Number(t.dataset.d);document.querySelectorAll(".seg button").forEach(function(b){b.classList.toggle("on",b===t)})}
  else if(a==="savec"){
    var n=Math.abs(parseInt($("#f-n").value,10));
    if(!n){$("#f-n").focus();return}
    addMove(cust.id,n*cust.dir,$("#f-c").value.trim());close();
  }
  else if(a==="savep"){
    var nm=$("#f-name").value.trim();if(!nm){$("#f-name").focus();return}
    db.collection("people").add({name:nm,createdAt:Date.now()}).catch(fail);close();
  }
  else if(a==="delmove"){db.collection("moves").doc(id).delete().catch(fail)}
  else if(a==="delp"){
    if(armed==="p"+id){
      moves.filter(function(m){return m.personId===id}).forEach(function(m){db.collection("moves").doc(m.id).delete().catch(fail)});
      db.collection("people").doc(id).delete().catch(fail);open=null;armed=null;
    }else{armed="p"+id;render();setTimeout(function(){armed=null;render()},3500)}
  }
});

function snap(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
function start(){
  var timer=setTimeout(function(){$("#note").textContent="Connexion lente… les données peuvent ne pas être à jour."},10000);
  var err=function(){$("#list").innerHTML='<div class="empty">Impossible de charger les données.<br>Vérifiez les règles Firestore et le code partagé.</div>'};
  db.collection("people").onSnapshot(function(s){clearTimeout(timer);people=snap(s);loaded.p=true;render()},err);
  db.collection("moves").onSnapshot(function(s){moves=snap(s);loaded.m=true;render()},err);
}
function askCode(){
  $("#modal").innerHTML='<div class="ov"><div class="sheet"><h2>Code partagé</h2>'+
  '<label>Choisissez un code long et secret, identique sur les deux téléphones</label>'+
  '<input id="f-code" autocomplete="off" autocapitalize="none" placeholder="ex. citron-bleu-4821-renard">'+
  '<div class="act"><button class="ok" data-act="savecode">Valider</button></div></div></div>';
}
function boot(code){
  var cfg=window.FIREBASE_CONFIG;
  firebase.initializeApp(cfg);
  var fs=firebase.firestore();
  db={collection:function(n){return fs.collection("rooms/"+code+"/"+n)}};
  firebase.auth().signInAnonymously().then(start).catch(function(){
    $("#list").innerHTML='<div class="empty">Connexion impossible.<br>Vérifiez que l’authentification anonyme est activée et que le domaine est autorisé dans Firebase.</div>';
  });
}
var cfg=window.FIREBASE_CONFIG;
if(!cfg||String(cfg.apiKey).indexOf("COLLEZ")===0){
  $("#list").innerHTML='<div class="empty">Configuration Firebase manquante.<br>Collez-la en haut du fichier.</div>';
}else{
  var saved=null;try{saved=localStorage.getItem("room")}catch(x){}
  if(saved)boot(saved);else askCode();
}
})();
</script>
</body>
</html>
